<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kaffe{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #fafafa; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; border-bottom: 2px solid #8B4513; padding-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #8B4513; color: white; }
        tr:hover { background: #fafafa; }
        .disponible { color: green; font-weight: bold; }
        .no-disponible { color: red; font-weight: bold; }
        .precio { font-weight: bold; color: #8B4513; }

        label { display: block; font-weight: 600; margin-bottom: 0.35rem; color: #444; }
        .form-control {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid #ccc;
            border-radius: 6px; font-size: 1rem; box-sizing: border-box;
            font-family: inherit;
        }
        .form-control:focus { outline: none; border-color: #8B4513; box-shadow: 0 0 0 2px rgba(139,69,19,0.15); }
        textarea.form-control { resize: vertical; }
        .form-group { margin-bottom: 1.1rem; }
        .btn {
            background: #8B4513; color: white; border: none; padding: 0.7rem 1.4rem;
            border-radius: 6px; font-size: 1rem; cursor: pointer; font-weight: 600;
        }
        .btn:hover { background: #a0522d; }
        .btn-secondary {
            background: #eee; color: #333; border: none; padding: 0.7rem 1.4rem;
            border-radius: 6px; font-size: 1rem; cursor: pointer; text-decoration: none;
            display: inline-block; font-weight: 600;
        }
        .btn-secondary:hover { background: #ddd; }
        .errorlist { color: #c0392b; margin: 0.2rem 0 0 0; padding-left: 1.2rem; font-size: 0.9rem; }
        .checkbox-group { display: flex; align-items: center; gap: 0.5rem; }
        .checkbox-group input[type="checkbox"] { width: auto; accent-color: #8B4513; cursor: pointer; }
        .actions { display: flex; gap: 0.8rem; margin-top: 1.2rem; align-items: center; }
    </style>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
